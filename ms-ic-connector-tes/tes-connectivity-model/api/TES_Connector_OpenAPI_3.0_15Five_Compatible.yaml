openapi: 3.0.3
info:
  title: TES Connector API
  description: OpenAPI specification for the CollegeSource TES Basic Web Service, structured for MuleSoft connector and DataWeave
    code generation.
  version: 1.0.0
servers:
- url: https://bws.collegesource.com
  description: Production server
security:
- TESAccessKey: []
paths:
  /CollegeSource_WSAPI_Basic.asmx/GetUsers:
    post:
      operationId: getUsers
      summary: Get users
      description: Get users.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GetUsersRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '500':
          $ref: '#/components/responses/ServerError'
