components:
  securitySchemes:
    TESAccessKey:
      type: apiKey
      in: header
      name: AccessKeyID
      description: TES access key. The actual TES service accepts AccessKeyID as a form field; this security definition is
        provided as connector authentication metadata.
  responses:
    UnauthorizedError:
      description: Unauthorized or invalid TES access key.
    BadRequestError:
      description: Invalid request parameters.
    ServerError:
      description: TES service error.
